name: release
# Publishes io.hibira:hibira-java and io.hibira:hibira-spring-boot-starter to
# Maven Central when a v* tag is pushed (for example by creating a GitHub
# release v0.1.0). The version comes from the tag.
#
# Secrets and variables (org or repo: Settings → Secrets and variables → Actions):
#   vars.CENTRAL_TOKEN_USERNAME / secrets.CENTRAL_TOKEN_PASSWORD  user token from central.sonatype.com → View Account → Generate User Token (org or repo level)
#   GPG_PRIVATE_KEY / GPG_PASSPHRASE                 an armored private key whose public key is on keys.openpgp.org
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test, sign and publish
        run: mvn -B -ntp -Prelease -Drevision=$VERSION deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ vars.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
